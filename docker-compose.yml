services:
  postgres:
    image: postgres:17-alpine
    container_name: yahnu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yahnu
      POSTGRES_USER: yahnu
      POSTGRES_PASSWORD: yahnu_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yahnu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yahnu -d yahnu"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  yahnu_pgdata:

